name: CALIBRE Guardian

# Every pull request: tests, lint, dependency audit, secret scan, MiCA/GDPR
# wording and an AI review comment. Every push to main: the same checks
# (owner decision 1 Nov 2026); a red run on main is an S2 alarm (Guardian's
# main watch). This check is the MERGE GATE: the pull request turns red and
# Guardian comments when any check fails; only green pull requests go on the
# owner's merge list. Only the owner merges, by writing "merge N".
# The checks themselves live in BitCore77-Calibre/calibre-guardian; this file
# only calls them. Guardian never merges pull requests.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guardian-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardian:
    permissions:
      contents: read
      issues: read
      pull-requests: write
    uses: BitCore77-Calibre/calibre-guardian/.github/workflows/check-repo.yml@main
    with:
      mode: ${{ github.event_name == 'push' && 'push' || 'pr' }}
      runner: ${{ vars.GUARDIAN_RUNNER }}
    secrets:
      GUARDIAN_GH_TOKEN: ${{ secrets.GUARDIAN_GH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
