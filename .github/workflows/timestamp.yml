name: Timestamp

# Re-signs timestamp.json every 12 hours, and right after a new releases.json reaches main:
# "this release list is still the current one" (calibre-core docs/SIGNED_FILES.md section 8).
# The timestamp key can sign nothing else; apps check its role. Published as the asset of the
# release "timestamp", so nothing is ever committed to main from here. Copied from calibre-core
# tools/release/release-list/updates-repo by publish-signed.sh; change it there.
# Test networks only; CLX has no value.

on:
  schedule:
    - cron: '23 */12 * * *'
  push:
    branches: [main]
    paths: [releases.json]
  workflow_dispatch:

permissions:
  contents: write          # only to replace the asset of the release "timestamp"

concurrency:
  group: timestamp
  cancel-in-progress: false

jobs:
  stamp:
    # Only main's code ever reaches the signing secrets: "Run workflow" on another branch does nothing
    # (audit UPD-3, 10 Nov 2026: a branch with an old timestamp.sh and an old releases.json could be dispatched).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The secrets reach only code whose hashes are written here, in the workflow file itself
      # (changing a workflow file needs the "workflows" permission, which no bot token has). Only
      # the pinned files and the data are copied to an empty folder, and Python runs with -I, so
      # nothing else in the repo can be loaded next to the secrets (review, 4 Nov 2026).
      - name: Copy exactly the reviewed tools to an empty folder
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/run"; mkdir -p "$R/tools" "$R/keys"
          cp tools/signed_files.py tools/timestamp.sh tools/signing-requirements.txt "$R/tools/"
          cp keys/calibre-signing-keys.json "$R/keys/"
          cp releases.json "$R/"
          cd "$R"
          printf '%s  %s\n' \
            2be3e45692362800f99531a548c93cdcd72a9adf85f004981b9d88d10c8a1066 tools/signed_files.py \
            fb5da3acc3bb3988da19658003e655a977028b19af4027fd9d1d1f2deee2f704 tools/timestamp.sh \
            8a2810d266ea4d8102b40e6e62efb07ae545b2a5ea1af89372b1cbf970044d11 tools/signing-requirements.txt \
            94618504a344c1ad902cae8d7b6639afac0d78ea10f01aded5b1b0c42af2f440 keys/calibre-signing-keys.json | sha256sum -c --strict
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The signing library, hash-locked
        run: |
          pip install -q --require-hashes --only-binary :all: --no-deps -r "$RUNNER_TEMP/run/tools/signing-requirements.txt"
      - name: Sign and publish the timestamp
        working-directory: ${{ runner.temp }}/run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TIMESTAMP_KEY: ${{ secrets.TIMESTAMP_KEY }}
          CALIBRE_SIGNING_PASSPHRASE: ${{ secrets.TIMESTAMP_PASSPHRASE }}
        run: bash tools/timestamp.sh
